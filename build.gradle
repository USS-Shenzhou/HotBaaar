plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

repositories {
    mavenLocal()
}

loom {
    // Use official Mojang mappings (mojmap) so most names from the NeoForge version keep working.
    // Intentionally NOT using Yarn, which would rename nearly every class/method.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_description', project.mod_description

    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
                'mod_description': project.mod_description
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Copy the graphics user interface resources into the jar, both from the shared source set...
sourceSets.main.resources {
    srcDir 'src/generated/resources'
}